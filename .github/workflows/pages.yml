name: Publish GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Download latest successful emulator build
        env:
          GH_TOKEN: ${{ secrets.MCUEMU_ACTIONS_READ_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "Add MCUEMU_ACTIONS_READ_TOKEN with read-only Actions access to devbis/mcuemu." >&2
            exit 1
          fi
          default_branch="$(gh api repos/devbis/mcuemu --jq '.default_branch')"
          run_id="$(gh run list --repo devbis/mcuemu --workflow wasm.yml --branch "$default_branch" --status completed --limit 100 --json databaseId,conclusion --jq '[.[] | select(.conclusion == "success")][0].databaseId // empty')"
          if [ -z "$run_id" ]; then
            echo "No successful wasm.yml run was found on devbis/mcuemu:$default_branch." >&2
            exit 1
          fi
          mkdir -p public/wasm
          gh run download "$run_id" --repo devbis/mcuemu --name mcuemu-wasm --dir public/wasm
          test -s public/wasm/mcuemu-wasm.mjs
          test -s public/wasm/mcuemu-wasm.wasm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
